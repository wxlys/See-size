<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 SeeSize</title><style>body{background:#0b1020;color:#e8eefc;font:16px system-ui;max-width:420px;margin:15vh auto;padding:24px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:12px 0;border-radius:8px}button{cursor:pointer}</style><h1>SeeSize</h1><p>管理员登录</p><form><label>管理凭据<input type="password" autocomplete="current-password" required aria-label="管理凭据"></label><button>登录</button></form><p id="message" role="status"></p><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('input'),button=document.querySelector('button');button.disabled=true;try{const res=await fetch('/api/v1/login',{method:'POST',headers:{'Content-Type':'application/json','X-SeeSize-Request':'1'},body:JSON.stringify({credential:input.value})});input.value='';if(!res.ok)throw new Error(res.status===429?'尝试过于频繁，请稍后重试':'登录失败，请检查管理凭据');location.replace('/');}catch(err){document.querySelector('#message').textContent=err.message}finally{button.disabled=false}};</script></html>
