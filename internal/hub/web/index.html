<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeeSize 服务器总览</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; background:#0b1020; color:#e8eefc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top left,#18264b 0,#0b1020 42%); }
    header { max-width:1180px; margin:auto; padding:48px 24px 26px; display:flex; align-items:end; justify-content:space-between; gap:20px; }
    h1 { margin:0; font-size:32px; letter-spacing:-.5px; }
    .subtitle { color:#97a8ca; margin-top:8px; }
    .status { color:#9db1d8; font-size:14px; }
    main { max-width:1180px; margin:auto; padding:0 24px 56px; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:20px; }
    .summary article,.server { background:rgba(20,29,53,.78); border:1px solid #2a3b65; border-radius:16px; box-shadow:0 18px 45px rgba(0,0,0,.18); }
    .summary article { padding:18px 20px; }
    .label { color:#93a5c9; font-size:13px; }
    .value { margin-top:7px; font-size:27px; font-weight:700; }
    #servers { display:grid; gap:14px; }
    [hidden] { display:none !important; }
    .workspace { display:grid; grid-template-columns:230px minmax(0,1fr); gap:18px; align-items:start; }
    .sidebar { position:sticky; top:16px; padding:14px; background:#10182c; border:1px solid #2a3b65; border-radius:16px; }
    .sidebar h2 { font-size:16px; margin:0 0 12px; }
    #server-nav { display:grid; gap:8px; }
    .server-choice { text-align:left; width:100%; min-width:0; }
    .server-choice span { display:block; overflow-wrap:anywhere; }
    .server-choice[aria-current="true"] { border-color:#79e2ae; background:#203852; }
    .server-choice .label { margin-top:6px; }
    #servers,.server-head>div { min-width:0; }
    .server h2,.meta { overflow-wrap:anywhere; }
    @media(max-width:760px){.workspace{grid-template-columns:1fr}.sidebar{position:static}#server-nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .server { padding:20px; }
    .server-head { display:flex; justify-content:space-between; gap:16px; align-items:center; }
    .server h2 { margin:0; font-size:19px; }
    .meta { margin-top:6px; color:#91a4c7; font-size:13px; }
    .pill { border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; }
    .online { color:#79e2ae; background:#123f35; }
    .offline { color:#ff9a9a; background:#472329; }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:18px; }
    .metric { background:#10182c; border-radius:12px; padding:13px; }
    .metric strong { display:block; margin-top:5px; font-size:17px; }
    .actions { display:flex; justify-content:flex-end; margin-top:14px; }
    button { color:#cfe0ff; background:#172544; border:1px solid #385487; border-radius:9px; padding:8px 12px; cursor:pointer; }
    button:hover { background:#20345e; }
    .history { margin-top:16px; padding-top:16px; border-top:1px solid #2a3b65; }
    select { background:#172544;color:#cfe0ff;border:1px solid #385487;padding:7px;border-radius:8px; }
    .history-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .history-head h3 { margin:0; font-size:15px; }
    .charts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .chart { background:#0e1629; border-radius:12px; padding:12px; min-width:0; }
    .chart-title { color:#9fb1d3; font-size:12px; margin-bottom:7px; display:flex; justify-content:space-between; }
    canvas { width:100%; height:170px; display:block; }
    .chart { position:relative; }
    .chart-tooltip { position:absolute; left:12px; right:12px; top:28px; background:#18243a; border:1px solid #7ea7ff; border-radius:6px; padding:8px; font-size:12px; white-space:pre-line; pointer-events:none; z-index:2; }
    .empty { color:#92a4c5; text-align:center; padding:56px 20px; border:1px dashed #34466f; border-radius:16px; }
    @media(max-width:760px){header{align-items:start;flex-direction:column}.summary{grid-template-columns:1fr}.metrics,.charts{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.metrics,.charts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div><h1>SeeSize</h1><div class="subtitle">多服务器资源监控与磁盘异常定位</div></div>
    <div id="updated" class="status">正在读取数据</div>
  </header>
  <main>
    <div class="actions"><button id="devices-toggle">设备管理</button><button id="logout">退出登录</button></div>
    <section id="devices-panel" class="server" hidden><h2>设备管理</h2><p class="label">使用稳定且唯一的设备 ID。注册码有效期 10 分钟，只能使用一次；重新注册将替换原设备凭据。</p><label>设备 ID <input id="enroll-id" maxlength="128"></label><button id="enroll">生成注册码</button><p id="device-message" role="status"></p><div id="device-list"></div></section>
    <section class="summary">
      <article><div class="label">服务器总数</div><div id="total" class="value">0</div></article>
      <article><div class="label">在线</div><div id="online" class="value">0</div></article>
      <article><div class="label">需关注</div><div id="attention" class="value">0</div></article>
    </section>
    <div class="workspace"><aside class="sidebar"><h2>服务器列表</h2><nav id="server-nav" aria-label="选择服务器"></nav></aside><section id="servers" aria-label="选中服务器详情"><div class="empty">尚未收到 Agent 数据</div></section></div>
  </main>
  <script>
    const nativeFetch=window.fetch.bind(window);
    window.fetch=async(url,options={})=>{const headers=new Headers(options.headers);if(options.method && options.method!=='GET')headers.set('X-SeeSize-Request','1');const res=await nativeFetch(url,{...options,headers});if(res.status===401)location.replace('/login');return res;};
    document.querySelector('#logout').onclick=async()=>{await fetch('/api/v1/logout',{method:'POST'});location.replace('/login');};
    async function devices(){const res=await fetch('/api/v1/devices');if(!res.ok)throw new Error('设备读取失败');const data=await res.json();const list=document.querySelector('#device-list');list.replaceChildren();for(const device of data.devices){const row=document.createElement('p');row.textContent=device.agent_id+' · '+(device.revoked?'已撤销':'已授权')+' ';if(!device.revoked){const button=document.createElement('button');button.textContent='撤销凭据';button.onclick=async()=>{if(!confirm('撤销后该设备将无法继续上报，是否继续？'))return;const res=await fetch('/api/v1/devices/'+encodeURIComponent(device.agent_id)+'/revoke',{method:'POST'});if(res.ok)devices();else document.querySelector('#device-message').textContent='撤销失败';};row.append(button)}list.append(row)}}
    document.querySelector('#devices-toggle').onclick=async()=>{const panel=document.querySelector('#devices-panel');panel.hidden=!panel.hidden;if(!panel.hidden)try{await devices()}catch(e){document.querySelector('#device-message').textContent=e.message}};
    document.querySelector('#enroll').onclick=async()=>{const message=document.querySelector('#device-message');try{const res=await fetch('/api/v1/enrollments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent_id:document.querySelector('#enroll-id').value.trim()})});if(!res.ok)throw new Error('创建失败，请检查设备 ID');const data=await res.json();message.textContent='一次性注册码（10 分钟内使用）：'+data.code}catch(e){message.textContent=e.message}};
    const fmtBytes = value => {
      if (!value) return '0 B';
      const units=['B','KB','MB','GB','TB']; let i=0; let n=value;
      while(n>=1024 && i<units.length-1){n/=1024;i++}
      return `${n.toFixed(i<2?0:1)} ${units[i]}`;
    };
    const pct = (used,total) => total ? `${(used*100/total).toFixed(1)}%` : '暂无';
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const expanded = new Set();
    let refreshing = false;
    const diskExpanded = new Set();
    const cards = new Map();
    function networkNote(network={}){
      if(network.scope==='unavailable')return '网络读取失败，本次速率不可用';
      if(network.rate_unavailable)return '网络速率不可用：首次基线、接口变化或缺失。接口：'+(network.interfaces||[]).join(', ')+'；缺失：'+(network.missing_interfaces||[]).join(', ');
      const scope=network.scope==='selected'?'指定网卡':'全部非回环网卡（可能含虚拟网卡重复流量）';
      return '当前网络口径：'+(network.scope?scope:'旧 Agent 未标注，旧版为全部非回环网卡')+' · '+(network.interfaces||[]).join(', ')+(network.missing_interfaces?.length?' · 缺失网卡：'+network.missing_interfaces.join(', ')+'，合计不完整':'')+'。单位 B/s；不是公网带宽。首次采样或网卡重置后以 0 建立基线；历史包含各采样时的口径，配置切换前后不可直接比较。';
    }
    const choices = new Map();
    let selectedID = null;
    function selectServer(id, reload=true){
      if(!cards.has(id))return;
      selectedID=id;
      for(const [key,card] of cards)card.hidden=key!==id;
      for(const [key,button] of choices)button.setAttribute('aria-current',String(key===id));
      if(reload){
        if(expanded.has(id))loadHistory(id);
        if(diskExpanded.has(id))loadDisk(id);
        if(eventExpanded.has(id))loadEvents(id,cards.get(id).querySelector('[data-events]').dataset.before||'');
      }
    }
    const eventExpanded=new Set();
    async function loadEvents(id,before=''){
      const card=cards.get(id);if(!card)return;
      const panel=card.querySelector('[data-events]'),list=panel.querySelector('.event-list');
      const sequence=Number(panel.dataset.sequence||0)+1;panel.dataset.sequence=sequence;panel.dataset.before=before;
      try{
        const res=await fetch(`/api/v1/servers/${encodeURIComponent(id)}/events${before?'?before='+encodeURIComponent(before):''}`);
        if(!res.ok)throw new Error(`HTTP ${res.status}`);
        const data=await res.json();if(Number(panel.dataset.sequence)!==sequence)return;
        const html=data.events.length?data.events.map(e=>`<article class="metric" style="margin-top:10px"><span class="pill ${e.acknowledged_at?'online':'offline'}">${e.acknowledged_at?'已处理':'待处理'}</span><p>${esc(e.root)} / ${esc(e.path)} · +${fmtBytes(e.delta)}</p><p class="label">${esc(new Date(e.from).toLocaleString())} — ${esc(new Date(e.to).toLocaleString())} · 触发阈值 ${fmtBytes(e.threshold)}</p>${e.acknowledged_at?`<p class="label">处理时间 ${esc(new Date(e.acknowledged_at).toLocaleString())}</p>`:`<button data-ack="${e.id}" ${data.ack_enabled?'':'disabled'}>标记已处理</button>`}</article>`).join(''):'<p class="label">暂无告警事件；功能启用后的新增增长会记录在这里。</p>';
        if(list.innerHTML!==html)list.innerHTML=html;
        panel.querySelector('.event-note').textContent=data.ack_enabled?'使用当前登录状态处理；已处理仅表示人工确认，不代表磁盘已恢复。':'服务端尚未配置管理凭据，目前只读。';
        const next=panel.querySelector('[data-event-next]');next.disabled=!data.next_cursor;next.dataset.cursor=data.next_cursor||'';
      }catch(e){panel.querySelector('.event-note').textContent=`读取失败：${e.message}`;}
    }
    async function loadDisk(id){
      const panel=document.querySelector(`[data-disk="${CSS.escape(encodeURIComponent(id))}"]`);
      if(!panel)return;
      if(panel.dataset.loading)return;
      panel.dataset.loading='true';
      try{
        const res=await fetch(`/api/v1/servers/${encodeURIComponent(id)}/disk`);
        if(!res.ok)throw new Error(`HTTP ${res.status}`);
        const data=await res.json(), snap=data.snapshots[0];
        const signature=JSON.stringify(data);
        if(panel.dataset.signature===signature)return;
        if(!snap){panel.textContent='暂无目录快照。请在该服务器上手动运行目录扫描。';return;}
        const deltas=new Map(data.changes.map(c=>[c.path,c.delta]));
        const warnings=(data.alerts||[]).slice(0,20).map(a=>`<p style="color:#f6b86a">空间增长提示：${esc(a.path)} +${fmtBytes(a.delta)}<br><span class="label">${esc(new Date(a.from).toLocaleString())} 至 ${esc(new Date(a.to).toLocaleString())}</span></p>`).join('');
        panel.innerHTML=`<h3>目录空间分析</h3><p><span class="pill ${snap.complete?'online':'offline'}">${snap.complete?'扫描完整':'扫描不完整'}</span></p><p class="label">扫描条目：${Number(snap.entries)||0} · 跳过条目：${Number(snap.skipped)||0}${snap.complete?'':' · 存在跳过项或达到扫描限制，暂停增量判断'}</p><p class="label">${esc(snap.root)} · ${esc(new Date(snap.at).toLocaleString())}</p><p class="label">逻辑文件大小；父目录包含子目录，不能相加。${data.comparable?'增量对比上一次完整扫描。':'暂无可比较的两次完整扫描。'}</p>`+
          `<p class="label">增长提示阈值：每次比较 ${fmtBytes(data.growth_threshold_bytes)}。提示仅反映两次扫描间净增量，不代表瞬时峰值或已确定原因。</p>`+warnings+
          snap.nodes.slice(0,500).map(n=>`<div style="display:flex;justify-content:space-between;padding:6px 0 6px ${Math.min(n.path.split('/').length,6)*14}px"><span>${esc(n.path)}</span><span>${fmtBytes(n.bytes)}${data.comparable?' · '+((deltas.get(n.path)||0)>=0?'+':'−')+fmtBytes(Math.abs(deltas.get(n.path)||0)):''}</span></div>`).join('')+
          (snap.nodes.length>500?'<p>仅展示前 500 个目录，完整结果保存在快照中。</p>':'');
        panel.dataset.signature=signature;
        panel.removeAttribute('title');
      }catch(e){if(!panel.dataset.signature)panel.textContent=`目录分析读取失败：${e.message}`;else panel.title=`更新失败，保留上次结果：${e.message}`;}
      finally{delete panel.dataset.loading;}
    }

    function drawLines(canvas, samples, series, ceiling, step){
      const ratio=window.devicePixelRatio||1;
      const width=Math.max(canvas.clientWidth,220), height=170;
      const left=66,right=12,top=10,bottom=30,pw=width-left-right,ph=height-top-bottom;
      canvas.width=width*ratio; canvas.height=height*ratio;
      const ctx=canvas.getContext('2d'); ctx.scale(ratio,ratio);
      ctx.clearRect(0,0,width,height);
      ctx.strokeStyle='#263858'; ctx.lineWidth=1;
      const values=series.flatMap(item=>samples.map(item.value)).filter(Number.isFinite);
      const max=Math.max(ceiling||0,...values,1), min=0;
      const start=samples.length?Date.parse(samples[0].at):0,end=samples.length?Date.parse(samples[samples.length-1].at):0;
      const network=canvas.dataset.chart==='network';
      const format=v=>network?fmtBytes(v)+'/s':v.toFixed(1)+'%';
      ctx.font='10px system-ui';ctx.fillStyle='#9fb1d3';
      for(let i=0;i<=4;i++){const y=top+ph*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(width-right,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(format(max*(1-i/4)),left-5,y+3);}
      if(samples.length)for(let i=0;i<=2;i++){ctx.textAlign=i===0?'left':i===2?'right':'center';ctx.fillText(new Date(start+(end-start)*i/2).toLocaleTimeString(),left+pw*i/2,height-8);}
      let tip=canvas.parentElement.querySelector('.chart-tooltip');
      if(!tip){tip=document.createElement('div');tip.className='chart-tooltip';tip.hidden=true;canvas.parentElement.append(tip);}
      tip.hidden=true;
      canvas.onpointerleave=()=>tip.hidden=true;
      canvas.onpointermove=e=>{
        const x=(e.clientX-canvas.getBoundingClientRect().left)*width/canvas.getBoundingClientRect().width;
        if(!samples.length||x<left||x>width-right){tip.hidden=true;return;}
        const time=start+(x-left)/pw*(end-start);
        const sample=samples.reduce((a,b)=>Math.abs(Date.parse(a.at)-time)<Math.abs(Date.parse(b.at)-time)?a:b);
        if(Math.abs(Date.parse(sample.at)-time)>step*1000){tip.textContent='该时间段无记录';tip.hidden=false;return;}
        if(network && sample.network_unavailable){tip.textContent='该聚合时段网络数据不可用或统计口径发生变化';tip.hidden=false;return;}
        const names=network?['下载平均','下载峰值','上传平均','上传峰值']:['平均','峰值'];
        tip.textContent=new Date(sample.at).toLocaleString()+' · 聚合 '+step+' 秒 · '+sample.count+' 个样本\n'+series.map((s,i)=>names[i]+'：'+format(s.value(sample))).join(' · ');tip.hidden=false;
      };
      for(const item of series){
        ctx.strokeStyle=item.color; ctx.lineWidth=item.peak?1:2;ctx.setLineDash(item.peak?[3,3]:[]); ctx.lineJoin='round'; ctx.beginPath();
        samples.forEach((sample,index)=>{
          const value=item.value(sample); const x=end===start?left+pw/2:left+(Date.parse(sample.at)-start)*pw/(end-start);
          if(!Number.isFinite(value))return;
          const y=top+ph-(Math.max(min,Math.min(max,value))-min)*ph/(max-min||1);
          const gap=index && (Date.parse(sample.at)-Date.parse(samples[index-1].at)>step*1000*1.5 || !Number.isFinite(item.value(samples[index-1])) || (network && sample.network_scope!==samples[index-1].network_scope));
          index&&!gap?ctx.lineTo(x,y):ctx.moveTo(x,y);
          ctx.fillStyle=item.color;ctx.fillRect(x-1,y-1,2,2);
        });
        ctx.stroke();
      }
    }

    async function loadHistory(agentID){
      const key=encodeURIComponent(agentID); const panel=document.querySelector(`[data-history="${CSS.escape(key)}"]`);
      if(!panel) return;
      const range=panel.querySelector('select').value;
      const sequence=Number(panel.dataset.sequence||0)+1;panel.dataset.sequence=sequence;
      try{
        const response=await fetch(`/api/v1/servers/${key}/trend?range=${range}`,{cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const data=await response.json();if(Number(panel.dataset.sequence)!==sequence)return;
        const samples=data.points;
        panel.querySelector('.history-note').textContent=samples.length?`实际数据：${new Date(data.first).toLocaleString()} — ${new Date(data.last).toLocaleString()} · 每 ${data.step_seconds} 秒聚合`:'所选时间范围暂无数据';
        const lines=(i,color)=>[{value:s=>i>=3&&s.network_unavailable?NaN:s.average[i],color},{value:s=>i>=3&&s.network_unavailable?NaN:s.peak[i],color,peak:true}];
        drawLines(panel.querySelector('[data-chart="cpu"]'),samples,lines(0,'#65d6ad'),100,data.step_seconds);
        drawLines(panel.querySelector('[data-chart="memory"]'),samples,lines(1,'#7ea7ff'),100,data.step_seconds);
        drawLines(panel.querySelector('[data-chart="network"]'),samples,[...lines(3,'#64d8ff'),...lines(4,'#f6b86a')],0,data.step_seconds);
        drawLines(panel.querySelector('[data-chart="disk"]'),samples,lines(2,'#c78cff'),100,data.step_seconds);
        panel.querySelectorAll('.time-axis').forEach(axis=>{axis.textContent=samples.length?`${new Date(samples[0].at).toLocaleString()} — ${new Date(samples[samples.length-1].at).toLocaleString()}`:'';});
      }catch(error){if(Number(panel.dataset.sequence)===sequence)panel.querySelector('.history-note').textContent=`历史读取失败：${error.message}`; }
    }

    function bindHistoryButtons(root){
      const id=decodeURIComponent(root.querySelector('[data-history-toggle]').dataset.historyToggle);
      root.querySelector('[data-event-toggle]').addEventListener('click',()=>{const panel=root.querySelector('[data-events]');panel.hidden=!panel.hidden;if(panel.hidden)eventExpanded.delete(id);else{eventExpanded.add(id);loadEvents(id);}});
      root.querySelector('[data-event-next]').addEventListener('click',e=>loadEvents(id,e.currentTarget.dataset.cursor));
      root.querySelector('[data-event-first]').addEventListener('click',()=>loadEvents(id));
      root.querySelector('.event-list').addEventListener('click',async e=>{
        const button=e.target.closest('[data-ack]');if(!button)return;
        const panel=root.querySelector('[data-events]'),input=panel.querySelector('input');
        const token=input.value;input.value='';button.disabled=true;
        try{const res=await fetch(`/api/v1/servers/${encodeURIComponent(id)}/events/${button.dataset.ack}/ack`,{method:'POST',headers:{Authorization:'Bearer '+token}});if(!res.ok)throw new Error(`HTTP ${res.status}`);await loadEvents(id,panel.dataset.before||'');}catch(err){panel.querySelector('.event-note').textContent=`处理失败：${err.message}`;button.disabled=false;}
      });
      root.querySelector('select').addEventListener('change',()=>loadHistory(decodeURIComponent(root.querySelector('[data-history-toggle]').dataset.historyToggle)));
      root.querySelectorAll('.chart').forEach(chart=>{const axis=document.createElement('div');axis.className='time-axis label';chart.append(axis);});
      root.querySelectorAll('[data-disk-toggle]').forEach(button=>button.addEventListener('click',()=>{
        const key=button.dataset.diskToggle,id=decodeURIComponent(key);
        diskExpanded.has(id)?diskExpanded.delete(id):diskExpanded.add(id);
        const panel=document.querySelector(`[data-disk="${CSS.escape(key)}"]`);panel.hidden=!diskExpanded.has(id);
        if(!panel.hidden)loadDisk(id);
      }));
      root.querySelectorAll('[data-history-toggle]').forEach(button=>button.addEventListener('click',()=>{
        const id=decodeURIComponent(button.dataset.historyToggle);
        expanded.has(id)?expanded.delete(id):expanded.add(id);
        const panel=document.querySelector(`[data-history="${CSS.escape(encodeURIComponent(id))}"]`);
        panel.hidden=!expanded.has(id); button.textContent=expanded.has(id)?'收起历史':'查看历史';
        if(expanded.has(id)) loadHistory(id);
      }));
    }

    async function refresh(){
      if(refreshing) return; refreshing=true;
      try {
        const response=await fetch('/api/v1/servers',{cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const {servers}=await response.json();
        const online=servers.filter(s=>s.online).length;
        const attention=servers.filter(s=>!s.online || (s.metrics?.root_disk?.total_bytes && s.metrics.root_disk.used_bytes/s.metrics.root_disk.total_bytes>=.8)).length;
        document.querySelector('#total').textContent=servers.length;
        document.querySelector('#online').textContent=online;
        document.querySelector('#attention').textContent=attention;
        document.querySelector('#updated').textContent=`更新时间 ${new Date().toLocaleTimeString()}`;
        const container=document.querySelector('#servers');
        const ids=new Set(servers.map(s=>s.agent_id));
        for(const [id,card] of cards){if(!ids.has(id)){card.remove();cards.delete(id);expanded.delete(id);diskExpanded.delete(id);eventExpanded.delete(id);choices.get(id)?.remove();choices.delete(id);}}
        if(servers.length)container.querySelector('.empty')?.remove();
        for(const s of servers){
          if(!choices.has(s.agent_id)){
            const button=document.createElement('button');button.type='button';button.className='server-choice';
            button.append(document.createElement('span'),document.createElement('span'));button.lastChild.className='label';
            button.onclick=()=>selectServer(s.agent_id);choices.set(s.agent_id,button);document.querySelector('#server-nav').append(button);
          }
          const choice=choices.get(s.agent_id);choice.firstChild.textContent=s.hostname||s.agent_id;
          choice.lastChild.textContent=`${s.online?'在线':'离线'} · ${s.agent_id}`;
          if(cards.has(s.agent_id)){
            const card=cards.get(s.agent_id);
            card.querySelector('h2').textContent=s.hostname;
            card.querySelector('.network-scope').textContent=networkNote(s.metrics?.network);
            card.querySelector('.meta').textContent=`${s.distribution||s.os} ${s.system_version} · ${s.architecture} · ${s.observed_ip}`;
            const badge=card.querySelector('.server-head .pill');badge.className=`pill ${s.online?'online':'offline'}`;badge.textContent=s.online?'在线':'离线';
            const values=[`${Number(s.metrics?.cpu_percent||0).toFixed(1)}%`,pct(s.metrics?.memory?.used_bytes,s.metrics?.memory?.total_bytes),pct(s.metrics?.root_disk?.used_bytes,s.metrics?.root_disk?.total_bytes),`${fmtBytes(s.metrics?.network?.received_bytes_per_second)}/s`];
            card.querySelectorAll('.metrics strong').forEach((node,i)=>{node.textContent=values[i];});
            if(s.metrics?.network?.rate_unavailable||s.metrics?.network?.scope==='unavailable')card.querySelectorAll('.metrics strong')[3].textContent='暂无';
            continue;
          }
          const key=esc(encodeURIComponent(s.agent_id)); const isExpanded=expanded.has(s.agent_id);
          const template=document.createElement('template');
          template.innerHTML=`
          <article class="server">
            <div class="server-head"><div><h2>${esc(s.hostname)}</h2><div class="meta">${esc(s.distribution || s.os)} ${esc(s.system_version)} · ${esc(s.architecture)} · ${esc(s.observed_ip)}</div></div><span class="pill ${s.online?'online':'offline'}">${s.online?'在线':'离线'}</span></div>
            <div class="metrics">
              <div class="metric"><div class="label">CPU</div><strong>${Number(s.metrics?.cpu_percent||0).toFixed(1)}%</strong></div>
              <div class="metric"><div class="label">内存</div><strong>${pct(s.metrics?.memory?.used_bytes,s.metrics?.memory?.total_bytes)}</strong></div>
              <div class="metric"><div class="label">根磁盘</div><strong>${pct(s.metrics?.root_disk?.used_bytes,s.metrics?.root_disk?.total_bytes)}</strong></div>
              <div class="metric"><div class="label">网络下行</div><strong>${fmtBytes(s.metrics?.network?.received_bytes_per_second)}/s</strong></div>
            </div>
            <p class="network-scope label">${esc(networkNote(s.metrics?.network))}</p>
            <div class="actions"><button type="button" data-history-toggle="${key}">${isExpanded?'收起历史':'查看历史'}</button></div>
            <div class="actions"><button type="button" data-disk-toggle="${key}">目录空间分析</button></div>
            <div class="actions"><button type="button" data-event-toggle>告警历史</button></div>
            <section class="history" data-events hidden><h3>目录增长事件</h3><p class="label">父子目录增量重叠，不能相加。事件按历史保留期限清理。处理操作使用当前管理员登录状态。</p><input type="hidden"><p class="event-note label"></p><div class="event-list"></div><div class="actions"><button data-event-first>最新事件</button><button data-event-next disabled>更早事件</button></div></section>
            <section class="history" data-disk="${key}" ${diskExpanded.has(s.agent_id)?'':'hidden'}>正在读取目录快照</section>
            <section class="history" data-history="${key}" ${isExpanded?'':'hidden'}>
              <div class="history-head"><h3>资源趋势</h3><select aria-label="趋势时间范围"><option value="30m">最近 30 分钟</option><option value="1h" selected>最近 1 小时</option><option value="24h">最近 24 小时</option></select></div>
              <p class="history-note label">正在读取历史</p><p class="label">实线：区间平均值 · 虚线：区间峰值 · 空白：该时间段无记录；横轴显示实际已有数据范围</p>
              <div class="charts">
                <div class="chart"><div class="chart-title"><span>CPU</span><span>%</span></div><canvas data-chart="cpu"></canvas></div>
                <div class="chart"><div class="chart-title"><span>内存</span><span>%</span></div><canvas data-chart="memory"></canvas></div>
                <div class="chart"><div class="chart-title"><span>网络</span><span>下载 / 上传</span></div><canvas data-chart="network"></canvas></div>
                <div class="chart"><div class="chart-title"><span>根磁盘</span><span>%</span></div><canvas data-chart="disk"></canvas></div>
              </div>
            </section>
          </article>`;
          const card=template.content.firstElementChild;cards.set(s.agent_id,card);container.append(card);bindHistoryButtons(card);
        }
        if(!servers.length && !container.querySelector('.empty'))container.innerHTML='<div class="empty">尚未收到 Agent 数据。启动 Agent 后这里会自动出现服务器。</div>';
        if(!cards.has(selectedID))selectedID=servers[0]?.agent_id??null;
        if(selectedID!==null){
          selectServer(selectedID,false);
          if(expanded.has(selectedID))loadHistory(selectedID);
          if(diskExpanded.has(selectedID))loadDisk(selectedID);
          const panel=cards.get(selectedID)?.querySelector('[data-events]');
          if(eventExpanded.has(selectedID) && panel && !panel.dataset.before)loadEvents(selectedID);
        }
      } catch(error){ document.querySelector('#updated').textContent=`读取失败 ${error.message}`; }
      finally { refreshing=false; }
    }
    refresh(); setInterval(refresh,5000);
  </script>
</body>
</html>
